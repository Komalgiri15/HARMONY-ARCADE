<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D8E6"/>
      <stop offset="0.52" stop-color="#F5EBE3"/>
      <stop offset="1" stop-color="#FDF6F0"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="20%" r="48%">
      <stop offset="0" stop-color="#FAEED8" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#F5DDD0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F5DDD0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur16" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blur28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="8" result="off"/>
      <feColorMatrix in="off" type="matrix"
        values="0 0 0 0 0.12
                0 0 0 0 0.08
                0 0 0 0 0.14
                0 0 0 0.18 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <!-- dreamy clouds -->
  <g opacity="0.42" filter="url(#blur28)">
    <ellipse cx="380" cy="220" rx="260" ry="90" fill="#FFFBF8"/>
    <ellipse cx="600" cy="260" rx="320" ry="110" fill="#FFFBF8"/>
    <ellipse cx="1500" cy="230" rx="280" ry="92" fill="#FFFBF8"/>
    <ellipse cx="1300" cy="265" rx="360" ry="120" fill="#FFFBF8"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 560 C220 500 420 520 640 470 C880 415 1040 430 1240 470 C1440 510 1660 515 1920 470 L1920 1080 L0 1080 Z"
        fill="#E4D0DC" opacity="0.58"/>
  <path d="M0 640 C260 590 500 605 720 560 C980 510 1180 520 1400 560 C1600 592 1760 600 1920 560 L1920 1080 L0 1080 Z"
        fill="#D8CCE4" opacity="0.45"/>

  <!-- mid hills -->
  <path d="M0 730 C240 680 460 700 680 655 C950 600 1160 615 1420 662 C1620 698 1760 710 1920 670 L1920 1080 L0 1080 Z"
        fill="#C5D8D2" opacity="0.52"/>
  <path d="M0 800 C280 760 520 770 760 735 C1040 690 1260 700 1500 735 C1700 765 1820 780 1920 760 L1920 1080 L0 1080 Z"
        fill="#E8D8D0" opacity="0.52"/>

  <!-- little pavilion silhouette on right hill -->
  <g transform="translate(1280 510)" opacity="0.72" filter="url(#softShadow)">
    <path d="M220 64 C182 40 145 32 110 36 C76 32 38 40 0 64 C26 20 66 0 110 0 C154 0 194 20 220 64 Z"
          fill="#6B5A6E" opacity="0.55"/>
    <path d="M40 68 H180 L165 86 H55 Z" fill="#6B5A6E" opacity="0.62"/>
    <rect x="62" y="86" width="96" height="66" rx="10" fill="#6B5A6E" opacity="0.55"/>
    <rect x="100" y="96" width="20" height="56" rx="8" fill="#5A4A5C" opacity="0.45"/>
    <circle cx="20" cy="128" r="16" fill="#F0DDB8" opacity="0.65"/>
    <circle cx="20" cy="128" r="30" fill="#F0DDB8" opacity="0.12" filter="url(#blur16)"/>
  </g>

  <!-- foreground soft grass -->
  <path d="M0 900 C220 860 420 880 640 860 C860 840 1040 860 1280 875 C1520 890 1700 892 1920 860 L1920 1080 L0 1080 Z"
        fill="#FDF6F0"/>

  <!-- petals -->
  <g opacity="0.45">
    <g transform="translate(300 360) rotate(-12)">
      <path d="M0 0 C10 -16 30 -16 40 0 C30 12 10 12 0 0 Z" fill="#EDC4D0" opacity="0.75"/>
    </g>
    <g transform="translate(1550 420) rotate(18)">
      <path d="M0 0 C10 -16 30 -16 40 0 C30 12 10 12 0 0 Z" fill="#EDC4D0" opacity="0.7"/>
    </g>
    <g transform="translate(1220 310) rotate(6)">
      <path d="M0 0 C8 -12 24 -12 32 0 C24 9 8 9 0 0 Z" fill="#E8CCD6" opacity="0.65"/>
    </g>
  </g>
</svg>
